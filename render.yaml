services:
  - type: web
    name: gympulse-ai
    runtime: node
    plan: free
    buildCommand: npm install && npx drizzle-kit migrate && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: gympulse-db
          property: connectionString
      - key: GYMPULSE_ACCESS_PASSWORD
        sync: false
      - key: GYMPULSE_AUTH_SECRET
        sync: false
      - key: GYMPULSE_AI_API_KEY
        sync: false
      - key: GYMPULSE_AI_MODEL
        value: gpt-4o-mini

databases:
  - name: gympulse-db
    plan: free
    databaseName: gympulse_ai
    user: gympulse_ai
